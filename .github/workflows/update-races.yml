name: Update Race Data

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday 7 AM UTC (3 AM ET)
  workflow_dispatch:      # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch race data
        run: python scripts/fetch_races.py

      - name: Commit updated data
        run: |
          git config user.name  "Race Data Bot"
          git config user.email "action@github.com"
          git add data/races.json
          git diff --staged --quiet && echo "No changes." || git commit -m "chore: update race data $(date -u +%Y-%m-%d)"
          git push
